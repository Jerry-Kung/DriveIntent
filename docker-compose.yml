services:
  app:
    build: .
    env_file:
      - .env
    volumes:
      # V1.1 我方车型配置：宿主机生成 config/our_models.json 后重启生效
      - ./config:/app/config:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
