skill_id: user_lead_analysis
version: "1.6.2"
description: >
  Based on the user's full comment history, video context, and statistical features,
  assess vehicle purchase intent and output H/A/B/C grade, purchase profile, and sales
  recommendations. Independently determines account-level car-owner and purchase-intent
  labels. Grading uses a THREE-stage pipeline: comment baseline (cumulative reinforcement
  from multiple similar comments merged into Stage 1) -> on-sale model match adjustment
  (4 tiers) -> homepage profile limited upgrade. merge_boost Stage 4 removed; logic
  folded into baseline grading standard. Results proceed to independent review node
  user_lead_review (V1.6.2). Invalid-user handling (already-purchased cap, promoters,
  marketers) remains in upstream filter user_lead_filter (V1.6).
model:
  name: ""
  temperature: 0.1
prompt_file: user_lead_analysis_v1.6.2.txt
prompt_version: "v1.6.2"